name: Spotlin CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  server-tests:
    name: Server Tests (Python & Java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install aiohttp pillow pyjwt cryptography

      - name: Compile and Test Java Server Engine
        run: |
          mkdir -p server/java/build
          javac -d server/java/build server/java/SpotlinCryptoVerifier.java
          java -cp server/java/build com.spotlin.server.SpotlinCryptoVerifier --test

      - name: Run Server Automated Tests
        run: |
          python3 server/tests/test_server.py

  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [server-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Spotlin APK
        uses: actions/upload-artifact@v4
        with:
          name: Spotlin-Messenger-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
